# Local development profile.
# Activate with: SPRING_PROFILES_ACTIVE=dev  (or -Dspring.profiles.active=dev)

# Frontend (Vite dev server) and backend run on different localhost ports.
FRONTEND_URL=http://localhost:5173
BACKEND_URL=http://localhost:8080

# Cookies must work over plain http on localhost.
# localhost:5173 <-> localhost:8080 is same-site, so Lax cookies are sent;
# secure=false lets the browser accept them without HTTPS.
app.cookie.secure=false
app.cookie.same-site=Lax
